<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Dedicated fontconfig for Google Chrome so it does not adopt Omarchy's
       system monospace font (e.g. IosevkaTerm) from ~/.config/fontconfig/fonts.conf. -->

  <!-- Capture the requested family before system/user fontconfig rules mutate it. -->
  <match target="pattern">
    <edit name="chrome_orig_family" mode="assign">
      <name>family</name>
    </edit>
  </match>

  <!-- Load standard system fontconfig (dirs, rendering, CJK, emoji, Arabic, metric aliases). -->
  <include>/etc/fonts/fonts.conf</include>

  <!-- Standard web generic families: Noto Sans / Noto Serif / Liberation Mono. -->
  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>sans</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>sans serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>system ui</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>mono</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>ui-monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>

  <!-- When a monospace font (or alias like Courier New / Consolas / Menlo) was
       requested explicitly, ~/.config/fontconfig/fonts.conf prepended the system
       monospace font ahead of it. Restore Liberation Mono as fallback and put
       the originally requested family back at the front. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <test name="chrome_orig_family" qual="first" compare="not_eq">
      <string>monospace</string>
    </test>
    <test name="chrome_orig_family" qual="first" compare="not_eq">
      <string>mono</string>
    </test>
    <test name="chrome_orig_family" qual="first" compare="not_eq">
      <string>ui-monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
    <edit name="family" mode="prepend_first" binding="strong">
      <name>chrome_orig_family</name>
    </edit>
  </match>

  <!-- Common non-installed web monospace names fall back to Liberation Mono. -->
  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>Courier</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>Courier New</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>Consolas</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>Menlo</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>Monaco</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>SF Mono</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="chrome_orig_family" qual="first">
      <string>SFMono-Regular</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Liberation Mono</string>
    </edit>
  </match>
</fontconfig>
