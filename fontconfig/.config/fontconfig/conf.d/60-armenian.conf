<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer Noto Sans Armenian (or Noto Serif Armenian for serif) when :lang=hy. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>hy</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Armenian</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains">
      <string>hy</string>
    </test>
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif Armenian</string>
    </edit>
  </match>

  <!-- Serif fallback for Armenian when lang is absent (Chromium/Electron). -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Serif Armenian</string>
    </edit>
  </match>

  <!-- Chromium and Electron resolve missing glyphs by codepoint without lang on
       the pattern, which otherwise falls through to a raw charset scan and lands
       on IosevkaTerm Nerd Font (condensed monospace). Appending Noto Sans Armenian
       as a last-resort family covers that path without affecting Latin, monospace,
       emoji, or CJK. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Armenian</string>
    </edit>
  </match>
</fontconfig>
